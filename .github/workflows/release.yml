name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & publish
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Build APK and desktop app
        run: |
          ./gradlew :composeApp:desktopTest :composeApp:assembleDebug :composeApp:createDistributable --no-daemon

      - name: Package desktop app
        run: |
          app_dir="$(find composeApp/build/compose/binaries/main/app -maxdepth 1 -mindepth 1 -type d | head -n 1)"
          test -n "$app_dir"
          cd "$(dirname "$app_dir")"
          zip -qr Roam-desktop-linux.zip "$(basename "$app_dir")"
          ls -lh Roam-desktop-linux.zip

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            composeApp/build/outputs/apk/debug/composeApp-debug.apk
            composeApp/build/compose/binaries/main/app/Roam-desktop-linux.zip
          generate_release_notes: true
